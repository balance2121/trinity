<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 영화 티어리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #141414;
    color: #fff;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    padding: 20px;
  }
  h1 {
    color: #e50914;
    text-align: center;
    margin-bottom: 20px;
    font-size: 2rem;
  }

  /* 입력 폼 */
  .form-box {
    background: #1f1f1f;
    border-radius: 10px;
    padding: 20px;
    max-width: 700px;
    margin: 0 auto 30px;
  }
  .form-box h2 { color: #e50914; font-size: 1.1rem; margin-bottom: 15px; }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .form-box input, .form-box select {
    width: 100%;
    padding: 8px 10px;
    border: none;
    border-radius: 5px;
    background: #333;
    color: #fff;
    font-size: 0.9rem;
  }
  .form-box input::placeholder { color: #aaa; }
  .full { grid-column: 1 / 3; }
  .add-btn {
    grid-column: 1 / 3;
    background: #e50914;
    color: #fff;
    font-weight: bold;
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1rem;
  }
  .add-btn:hover { background: #f6121d; }

  /* 등급 구역 */
  .tier {
    display: flex;
    align-items: stretch;
    margin-bottom: 15px;
    border-radius: 8px;
    overflow: hidden;
    background: #1a1a1a;
  }
  .tier-label {
    width: 70px;
    min-width: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: bold;
    color: #141414;
  }
  .tier-S .tier-label { background: #ff7f7f; }
  .tier-A .tier-label { background: #ffbf7f; }
  .tier-B .tier-label { background: #ffff7f; }
  .tier-C .tier-label { background: #7fff7f; }
  .tier-movies {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px;
    min-height: 100px;
  }

  /* 영화 카드 */
  .card {
    width: 140px;
    background: #222;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    font-size: 0.8rem;
  }
  .card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: #000;
    display: block;
  }
  .card .no-img {
    width: 100%;
    height: 190px;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 0.75rem;
  }
  .card-body { padding: 8px; }
  .card-title { font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
  .card-star { color: #ffd700; margin-bottom: 4px; }
  .card-info { color: #aaa; font-size: 0.75rem; margin-bottom: 2px; }
  .card-review {
    color: #ddd;
    font-style: italic;
    margin-top: 6px;
    font-size: 0.75rem;
    border-top: 1px solid #333;
    padding-top: 5px;
  }
  .del-btn {
    position: absolute;
    top: 5px; right: 5px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 22px; height: 22px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .del-btn:hover { background: #e50914; }
</style>
</head>
<body>

<h1>🎬 영화 티어리스트</h1>

<!-- 입력 폼 -->
<div class="form-box">
  <h2>+ 영화 추가</h2>
  <div class="form-grid">
    <input type="text" id="title" placeholder="영화 제목">
    <select id="grade">
      <option value="S">S 등급</option>
      <option value="A">A 등급</option>
      <option value="B">B 등급</option>
      <option value="C">C 등급</option>
    </select>
    <input type="text" id="poster" class="full" placeholder="포스터 이미지 URL (http://...)">
    <input type="text" id="director" placeholder="감독">
    <input type="number" id="year" placeholder="년도 (예: 2024)">
    <input type="text" id="genre" placeholder="장르 (예: 액션)">
    <input type="number" id="star" placeholder="별점 (1~5)" min="1" max="5">
    <input type="text" id="review" class="full" placeholder="한줄 평가">
    <button class="add-btn" onclick="addMovie()">영화 추가하기</button>
  </div>
</div>

<!-- 등급 구역 -->
<div id="tiers">
  <div class="tier tier-S"><div class="tier-label">S</div><div class="tier-movies" id="tier-S"></div></div>
  <div class="tier tier-A"><div class="tier-label">A</div><div class="tier-movies" id="tier-A"></div></div>
  <div class="tier tier-B"><div class="tier-label">B</div><div class="tier-movies" id="tier-B"></div></div>
  <div class="tier tier-C"><div class="tier-label">C</div><div class="tier-movies" id="tier-C"></div></div>
</div>

<script>
  // 영화 목록 불러오기 (로컬스토리지)
  let movies = JSON.parse(localStorage.getItem('movies') || '[]');

  // 별점을 ⭐로 변환
  function stars(n) {
    n = parseInt(n) || 0;
    return '⭐'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n));
  }

  // 영화 추가
  function addMovie() {
    const title = document.getElementById('title').value.trim();
    if (!title) { alert('영화 제목을 입력해주세요!'); return; }

    const movie = {
      id: Date.now(),
      title: title,
      grade: document.getElementById('grade').value,
      poster: document.getElementById('poster').value.trim(),
      director: document.getElementById('director').value.trim(),
      year: document.getElementById('year').value.trim(),
      genre: document.getElementById('genre').value.trim(),
      star: document.getElementById('star').value.trim(),
      review: document.getElementById('review').value.trim()
    };

    movies.push(movie);
    save();
    render();
    clearForm();
  }

  // 삭제
  function delMovie(id) {
    movies = movies.filter(m => m.id !== id);
    save();
    render();
  }

  // 저장
  function save() {
    localStorage.setItem('movies', JSON.stringify(movies));
  }

  // 입력폼 비우기
  function clearForm() {
    ['title','poster','director','year','genre','star','review'].forEach(
      id => document.getElementById(id).value = ''
    );
  }

  // 화면에 그리기
  function render() {
    ['S','A','B','C'].forEach(g => document.getElementById('tier-' + g).innerHTML = '');

    movies.forEach(m => {
      const posterHTML = m.poster
        ? `<img src="${m.poster}" alt="${m.title}" onerror="this.outerHTML='<div class=\'no-img\'>이미지 없음</div>'">`
        : `<div class="no-img">포스터 없음</div>`;

      const card = `
        <div class="card">
          <button class="del-btn" onclick="delMovie(${m.id})">×</button>
          ${posterHTML}
          <div class="card-body">
            <div class="card-title">${m.title}</div>
            <div class="card-star">${stars(m.star)}</div>
            <div class="card-info">🎬 ${m.director || '-'}</div>
            <div class="card-info">📅 ${m.year || '-'} · ${m.genre || '-'}</div>
            ${m.review ? `<div class="card-review">"${m.review}"</div>` : ''}
          </div>
        </div>`;

      document.getElementById('tier-' + m.grade).innerHTML += card;
    });
  }

  // 첫 화면 그리기
  render();
</script>

</body>
</html>
